<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>OG · חסלט מחסלת</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1200px;height:630px;overflow:hidden;}
  body{font-family:'Rubik',sans-serif;color:#161616;position:relative;
    background:radial-gradient(120% 90% at 50% -10%, #fff 0%, #eef7e6 45%, #d6ecc2 100%);}
  .field{position:absolute;left:0;right:0;bottom:0;height:250px;
    background:repeating-linear-gradient(0deg, rgba(60,110,30,.10) 0 3px, transparent 3px 44px), linear-gradient(#bfe58f,#8fce5a);
    border-top:6px solid #fff; box-shadow:0 -4px 0 #6FB23C;}
  .logo{position:absolute;right:54px;top:40px;width:230px;background:#fff;border-radius:22px;padding:8px 10px;
    border:4px solid #fff;outline:4px solid #6FB23C;outline-offset:-4px;box-shadow:0 16px 38px rgba(30,55,15,.18);}
  .logo img{width:100%;display:block;}
  .title{position:absolute;right:320px;top:58px;font-size:86px;font-weight:900;letter-spacing:-2px;line-height:1;
    text-shadow:0 4px 0 #fff, 0 10px 24px rgba(30,55,15,.18);}
  .sub{position:absolute;right:322px;top:170px;font-size:29px;font-weight:700;color:#3a3a3a;max-width:540px;line-height:1.3;}
  .sub b{color:#4f8f2a;}
  .tag{position:absolute;right:322px;top:272px;background:#161616;color:#fff;font-weight:800;font-size:24px;padding:10px 22px;border-radius:999px;}
  .tag b{color:#8fce5a;}
  .hole{position:absolute;bottom:34px;width:230px;height:300px;}
  .hole .dirt{position:absolute;left:4%;right:4%;bottom:6%;height:20%;border-radius:50%;
    background:radial-gradient(ellipse at 50% 42%, #7a5230 0%, #5b3b1e 55%, #3d2812 100%);box-shadow:inset 0 8px 12px rgba(0,0,0,.4);}
  .hole .pit{position:absolute;left:3%;right:3%;top:0;bottom:16%;overflow:hidden;}
  .hole .pit svg{position:absolute;left:0;right:0;bottom:-6%;width:100%;height:100%;}
  .hole .front{position:absolute;left:-3%;right:-3%;bottom:-1%;height:22%;}
  .hole .front svg{width:100%;height:100%;}
  .hand{position:absolute;left:-30px;top:40px;width:380px;height:506px;transform:rotate(-26deg);filter:drop-shadow(0 18px 18px rgba(20,40,10,.3));}
  .hand svg{width:100%;height:100%;}
  .stamp{position:absolute;left:850px;top:312px;transform:rotate(-14deg);font-weight:900;font-size:54px;color:#c2185b;background:#fff;
    border:6px solid #c2185b;border-radius:18px;padding:6px 26px;}
  .brand{position:absolute;left:40px;bottom:22px;font-size:20px;font-weight:700;color:#2f4a1f;background:rgba(255,255,255,.85);padding:8px 16px;border-radius:999px;}
</style>
</head>
<body>
  <div class="field"></div>
  <div class="logo"><img src="../assets/logo.jpg" alt="חסלט" /></div>
  <div class="title">חסלט מְחַסֶּלֶת</div>
  <div class="sub">יד אחת. צרור <b>עלי סלק</b>. אפס סובלנות לאויבינו ומבקשי רעתנו.</div>
  <div class="tag">🥬 המשחק · <b>שחקו עכשיו</b></div>
  <div class="hole" style="right:70px" id="h1"></div>
  <div class="hole" style="right:330px" id="h2"></div>
  <div class="hole" style="right:590px" id="h3"></div>
  <div class="hand" id="hand"></div>
  <div class="stamp">חוּסַל!</div>
  <div class="brand">בחסות חסלט · ירק נקי, בלי חרקים</div>
  <script src="../js/characters.js"></script>
  <script src="../js/products.js"></script>
  <script>
    const ids = ['nasrallah', 'khamenei', 'sinwar'];
    ['h1', 'h2', 'h3'].forEach((h, i) => {
      const e = Chars.ENEMIES.find(x => x.id === ids[i]);
      document.getElementById(h).innerHTML = `<div class="dirt"></div><div class="pit"><div class="sprite ${i === 0 ? 'hit' : ''}">${Chars.renderEnemy(e)}</div></div><div class="front">${Products.renderHoleFront(i + 3)}</div>`;
    });
    document.getElementById('hand').innerHTML = Chars.renderHand({ id: 'og' });
  </script>
  <style>
    svg .h{display:none;} .sprite.hit svg .h{display:inline;} .sprite.hit svg .n{display:none;}
    .sprite{position:absolute;inset:0;}
  </style>
</body>
</html>
